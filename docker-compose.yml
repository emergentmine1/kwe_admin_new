# KWE Instant Quote Admin — Next.js admin UI (server-side rendered).
#
# UI only with dummy data (no backend / DB):  docker compose up --build frontend
# Against the Java backend: set AUTH_MODE=static (or okta) and BACKEND_URL below.
# BASE_PATH is the context path (e.g. /rqms) and is fixed at build time.

services:
  frontend:
    container_name: instantquote-frontend
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
      args:
        BASE_PATH: ""
    environment:
      AUTH_MODE: demo
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (32+ chars) in .env}
      BACKEND_URL: ${BACKEND_URL:-}
    ports:
      - "3001:3000"
    restart: unless-stopped
